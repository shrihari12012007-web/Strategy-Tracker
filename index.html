<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Strategy Tracker - Productivity, Study Routines & Academic Milestone Execution PWA" />
  <title>Strategy Tracker | Academic & Routine Execution</title>
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen">

  <main class="glass-container my-auto">
    <!-- Header -->
    <header class="flex items-center justify-between border-b border-white/10 pb-4 mb-6">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-white flex items-center gap-2">
          <span>🎯</span> Strategy Tracker
        </h1>
        <p class="text-xs text-white/60 mt-0.5">Academic Routines & Daily Execution</p>
      </div>
      <div class="text-right">
        <span id="liveClockDisplay" class="font-mono text-sm font-semibold text-cyan-300 bg-cyan-950/40 border border-cyan-800/50 px-2.5 py-1 rounded-lg">
          --:--:--
        </span>
      </div>
    </header>

    <!-- Circular Progress Visualization -->
    <section class="flex flex-col items-center justify-center mb-6">
      <div class="relative size-36">
        <svg class="size-full -rotate-90" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="18" r="16" fill="none" class="stroke-current text-white/10" stroke-width="2.5"></circle>
          <circle 
            id="progressCircle" 
            cx="18" 
            cy="18" 
            r="16" 
            fill="none" 
            class="stroke-current transition-all duration-700" 
            stroke-width="2.5" 
            stroke-dasharray="100" 
            stroke-dashoffset="100" 
            stroke-linecap="round"
          ></circle>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span id="percent" class="text-3xl font-extrabold text-white tracking-tight">0%</span>
          <span class="text-[10px] uppercase font-bold text-white/40 tracking-wider">Efficiency</span>
        </div>
      </div>
      <p id="taskStats" class="text-xs text-white/70 mt-3 font-medium">0 of 0 routines completed</p>
    </section>

    <!-- Task Creation Controls -->
    <section class="space-y-2 mb-6">
      <div class="flex gap-2">
        <input 
          type="text" 
          id="taskInput" 
          placeholder="Add study routine or milestone..." 
          class="bg-white/5 border border-white/15 text-white placeholder-white/40 text-sm px-3.5 py-2.5 flex-grow rounded-xl focus:ring-2 focus:ring-indigo-400 focus:border-transparent transition"
        />
        <select 
          id="taskCategory" 
          class="bg-slate-900 border border-white/15 text-white text-xs px-2.5 py-2.5 rounded-xl cursor-pointer"
        >
          <option value="NEET">NEET</option>
          <option value="VTU CSE">VTU CSE</option>
          <option value="Academic">Academic</option>
          <option value="Routine" selected>Routine</option>
        </select>
        <button 
          onclick="addTask()" 
          class="glow-btn text-white px-5 py-2.5 rounded-xl font-bold text-sm tracking-wide"
        >
          Add
        </button>
      </div>

      <div class="flex justify-between items-center px-1 text-xs text-white/50">
        <button onclick="clearCompleted()" class="hover:text-white transition">Clear Completed</button>
        <button onclick="resetDefaultTasks()" class="hover:text-white transition">Reset Template</button>
      </div>
    </section>

    <!-- Active Task List -->
    <section id="taskList" class="space-y-2.5 mb-8 max-h-72 overflow-y-auto pr-1"></section>

    <!-- Focus Pomodoro Timer -->
    <section class="border-t border-white/10 pt-5 mb-6">
      <div class="flex items-center justify-between mb-3">
        <span class="text-xs font-semibold text-white/80 uppercase tracking-wider flex items-center gap-1.5">
          <span>⏱️</span> Study Focus Engine
        </span>
        <div class="flex gap-1.5 text-[11px]">
          <button onclick="setFocusDuration(25)" class="px-2 py-0.5 rounded bg-white/5 hover:bg-white/15 text-white/70">25m</button>
          <button onclick="setFocusDuration(50)" class="px-2 py-0.5 rounded bg-white/5 hover:bg-white/15 text-white/70">50m</button>
          <button onclick="setFocusDuration(5)" class="px-2 py-0.5 rounded bg-white/5 hover:bg-white/15 text-white/70">5m</button>
        </div>
      </div>

      <div class="flex items-center justify-between bg-white/5 border border-white/10 rounded-xl p-3">
        <span id="focusTimerDisplay" class="font-mono text-2xl font-bold text-indigo-300">25:00</span>
        <div class="flex gap-2">
          <button 
            id="timerToggleBtn" 
            onclick="toggleFocusTimer()" 
            class="px-4 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs transition"
          >
            Start Focus
          </button>
          <button 
            onclick="resetFocusTimer()" 
            class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white font-medium text-xs transition"
          >
            Reset
          </button>
        </div>
      </div>
    </section>

    <!-- Routine Alarm Section -->
    <section class="border-t border-white/10 pt-5 space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold text-white/80 uppercase tracking-wider flex items-center gap-1.5">
          <span>⏰</span> Daily Routine Alarm
        </span>
        <div id="alarmStatus"></div>
      </div>

      <div class="flex gap-2">
        <input 
          type="time" 
          id="alarmInput" 
          class="bg-white/5 border border-white/15 text-white rounded-xl px-3 py-2 text-sm flex-grow"
        />
        <button 
          onclick="activateAlarm()" 
          class="bg-white/10 hover:bg-white/20 text-white text-xs font-semibold px-4 py-2 rounded-xl border border-white/15 transition"
        >
          Set Alarm
        </button>
        <button 
          onclick="playAlarmSound()" 
          class="bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 text-xs font-semibold px-3 py-2 rounded-xl border border-emerald-500/30 transition"
          title="Test synthesized alarm chime"
        >
          Test
        </button>
      </div>

      <button 
        id="stopAlarmBtn" 
        onclick="stopAlarm()" 
        class="hidden w-full bg-rose-600 hover:bg-rose-500 text-white py-2.5 rounded-xl font-bold text-sm transition animate-pulse"
      >
        STOP ALARM CHIME
      </button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
